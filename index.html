        function mostrarLeyesEnPantalla(listaDeLeyes) {
            const contenedorHTML = document.getElementById('contenedorListaLeyes');
            contenedorHTML.innerHTML = '';

            if (listaDeLeyes.length === 0) {
                contenedorHTML.innerHTML = '<p style="text-align:center; color:#95a5a6;">No se encontraron resultados.</p>';
                return;
            }

            listaDeLeyes.forEach(ley => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta-ley';
                tarjeta.innerHTML = `
                    <span class="categoria-ley">${ley.categoria}</span>
                    <div class="titulo-ley">${ley.titulo}</div>
                    <div class="texto-ley">${ley.textolargo}</div>
                `;
                contenedorHTML.appendChild(tarjeta);
            });
        }

        window.onload = function() {
            mostrarLeyesEnPantalla(baseDeDatosLeyes);
        };

        function filtrarLeyes() {
            const textoBusqueda = document.getElementById('campoBuscador').value.toLowerCase().trim();
            
            const leyesFiltradas = baseDeDatosLeyes.filter(ley => {
                return ley.titulo.toLowerCase().includes(textoBusqueda) || 
                       ley.categoria.toLowerCase().includes(textoBusqueda) || 
                       ley.textolargo.toLowerCase().includes(textoBusqueda);
            });

            mostrarLeyesEnPantalla(leyesFiltradas);
        }
    </script>
